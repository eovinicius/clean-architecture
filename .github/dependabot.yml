version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "daily"
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/app/src/Web.Api"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
