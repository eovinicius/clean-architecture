services:
  web-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    image: ${DOCKER_REGISTRY-}webapi
    container_name: web-api
    build:
      context: .
      dockerfile: app/src/Web.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    depends_on:
      postgres:
        condition: service_healthy
      observability:
        condition: service_started

  postgres:
    image: postgres:17.6
    container_name: postgres
    environment:
      - POSTGRES_DB=clean-architecture
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clean-architecture"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Grafana + Loki (logs) + Tempo (traces) + Prometheus (metrics) + an OpenTelemetry
  # Collector, all bundled in one image. Open Grafana at http://localhost:3000.
  observability:
    image: grafana/otel-lgtm:0.29.1
    container_name: observability
    ports:
      - 3000:3000 # Grafana
      - 4317:4317 # OTLP gRPC
      - 4318:4318 # OTLP HTTP
