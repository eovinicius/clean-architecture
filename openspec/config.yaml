schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Idioma: escreva todos os artefatos em português do Brasil (pt-BR). Código, nomes de
  tipos/arquivos, comandos, paths e termos técnicos consolidados ficam no original.

  Projeto: template de Clean Architecture em .NET 10 (C#, Nullable + ImplicitUsings),
  API minimal com PostgreSQL. Solução: CleanArchitecture.slnx. Projetos em app/src/
  (SharedKernel, Domain, Application, Infrastructure, Web.Api) e app/tests/
  (Application.UnitTests, ArchitectureTests, IntegrationTests). Props compartilhadas
  (Directory.Build.props, Directory.Packages.props com versões centralizadas) e
  docker-compose* ficam na raiz. Feature de exemplo: Todos; Users + auth são base.

  Arquitetura (dependências apontam para dentro, verificadas por ArchitectureTests/NetArchTest):
  - SharedKernel: Result/Result<T>, Error/ErrorType, ValidationError, Entity, IDomainEvent,
    IDomainEventHandler<T>, IDateTimeProvider. Sem dependências.
  - Domain: entidades (sealed, herdam Entity, Guid Id, propriedades simples, FK ids sem
    navegações), domain events (records com ids), catálogos {Entity}Errors. Só SharedKernel.
  - Application: casos de uso em fatias verticais app/src/Application/{Feature}/{UseCase}/.
    ICommand/ICommand<T> + ICommandHandler, IQuery<T> + IQueryHandler (sem MediatR).
    Handlers internal sealed com primary constructor, registrados por Scrutor e envolvidos
    por ValidationDecorator + LoggingDecorator. Validadores FluentValidation por comando.
    Abstrações: IApplicationDbContext, IUserContext, IEmailSender, ITokenProvider, IPasswordHasher.
  - Infrastructure: EF Core + Npgsql (snake_case), configurações IEntityTypeConfiguration em
    Infrastructure/{Feature}/, migrações em Infrastructure/Database/Migrations, JWT + refresh
    tokens, autorização por permissão, HybridCache, dispatch de domain events, LoggingEmailSender.
  - Web.Api: endpoints IEndpoint auto-descobertos em Endpoints/{Feature}/{UseCase}.cs,
    Scalar/OpenAPI, rate limiting, security headers, CORS, filtro de idempotência
    (.WithIdempotency() + header Idempotency-Key), exception handler global + ProblemDetails,
    background jobs (BackgroundService em BackgroundJobs/ com escopo por iteração).

  Convenções:
  - Falhas esperadas retornam Result.Failure(Error); exceções só para o inesperado.
    Códigos de erro "{FeaturePlural}.{Reason}" com tipo semântico (NotFound 404, Conflict 409,
    Problem 400, Unauthorized 401, Forbidden 403, Failure 500). Endpoints traduzem com result.Match(Results.Ok|NoContent,
    CustomResults.Problem).
  - Nomes: {Verb}{Entity}Command, Get{X}Query, {Command|Query}Handler, {Command}Validator,
    {X}Response (DTO por fatia), {Feature}CacheKeys.
  - Endpoints declaram autorização (.RequireAuthorization() ou .HasPermission("...")) e tags.
    Handlers sobre dados do usuário verificam propriedade via IUserContext.UserId.
  - Comandos que mudam estado disparam domain event (entity.Raise(...)) antes de SaveChangesAsync.
  - Queries projetam direto para DTO com .Select(...); listagens retornam PagedList<T>
    (busca + ordenação + página). Leituras cacheadas com HybridCache exigem invalidação em
    toda mutação relacionada.
  - Nada de DateTime.UtcNow/Now na Application: usar IDateTimeProvider.
  - Logging estruturado (Serilog) + OpenTelemetry via OTLP para Grafana/Loki/Tempo.
  - Build analyzer-strict: TreatWarningsAsErrors, AnalysisMode All, SonarAnalyzer,
    EnforceCodeStyleInBuild — o build é o lint. Preferir collection expressions e ToUpperInvariant.
  - Novas dependências só com confirmação do usuário; nunca editar migrações aplicadas à mão.

  Testes: xUnit + Shouldly + NSubstitute; FluentValidation.TestHelper para validadores;
  WebApplicationFactory + Testcontainers (PostgreSQL) para integração (exige Docker).
  Unitários herdam BaseHandlerTest (CreateDbContext/CreateCache, nunca mockar DbContext).
  Nomes: Handle_Should_{Outcome}_When{Condition} (unit), {Action}_Should_{Outcome}[_When{Condition}]
  (integração). Arrange/Act/Assert comentados.

  Validação: dotnet build CleanArchitecture.slnx e dotnet test CleanArchitecture.slnx (CI em
  .github/workflows/build.yml). Migrações: dotnet ef migrations add {Nome_Com_Underscores}
  --project app/src/Infrastructure --startup-project app/src/Web.Api.

  Skills do projeto para implementar: /add-feature, /add-entity, /add-tests, /add-migration,
  /add-background-job, /bootstrap, /ca-review. Diretrizes gerais em AGENTS.md e CLAUDE.md.

# Per-artifact rules (optional)
rules:
  proposal:
    - Deixe explícito o que está fora do escopo (Non-goals); mudança mínima, sem refatorações oportunistas
    - Liste as features/camadas afetadas (Domain, Application, Infrastructure, Web.Api, testes)
    - Sinalize mudanças de contrato público (rotas, payloads, códigos de erro) e de schema do banco
    - Sinalize qualquer dependência nova de pacote — exige confirmação do usuário
  specs:
    - Cenários cobrem o caminho feliz e cada falha esperada, com o código de erro "{FeaturePlural}.{Reason}" e o status HTTP correspondente
    - Inclua cenários de autorização (401 sem token, propriedade do recurso/permissão) para endpoints novos
    - Inclua cenários de validação de entrada para cada comando que recebe dados externos
    - Para listagens, especifique busca, ordenação e paginação (PagedList)
  design:
    - Mapeie cada caso de uso para sua fatia (Command/Query, Handler, Validator, Response, Endpoint) com nomes seguindo as convenções
    - Respeite a direção das dependências; nenhuma referência que inverta camadas
    - Defina erros novos no catálogo {Entity}Errors e domain events disparados por cada comando
    - Descreva cache (chaves em {Feature}CacheKeys) e a invalidação simétrica em cada mutação
    - Descreva mudanças de modelo/EF (configuração em Infrastructure/{Feature}/) e a migração necessária
    - Prefira abstrações e utilitários existentes; não crie abstrações especulativas
  tasks:
    - Ordene por camada de dentro para fora — Domain, Application, Infrastructure (+ migração), Web.Api, testes
    - Indique a skill do projeto a usar em cada tarefa quando aplicável (/add-entity, /add-feature, /add-migration, /add-tests, /add-background-job)
    - Cada fatia inclui testes unitários do handler, testes do validador e testes de integração HTTP
    - Termine com a verificação (dotnet build e dotnet test na solução, sem avisos) e uma revisão com /ca-review
    - Não inclua tarefa de commit; commit só com pedido explícito do usuário
